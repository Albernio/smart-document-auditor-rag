[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-document-auditor-rag"
version = "0.1.0"
description = "RAG-based document auditing application"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pypdf>=6.0",
    "sentence-transformers>=5.0",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "reportlab>=4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
